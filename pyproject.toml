[project]
name = "pivot-control"
version = "0.1.0"
description = "Remote control and monitoring of a centre-pivot irrigator through an edge controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.18.8",
]

[project.scripts]
export-config = "pivot_control.app_config:export"
export-ui = "pivot_control.app_ui:export"
export-notifications = "pivot_control.app_notifications:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pivot_control"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
